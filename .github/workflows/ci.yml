name: CI

# Manual only while in active development (saves Actions minutes):
# run it from the GitHub "Actions" tab, or `gh workflow run CI`.
# Locally, `scripts/check.sh` runs the same checks for free.
on:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  boot-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n deploy/boot/rewind-boot deploy/boot/tv-switch deploy/boot/install-boot-menu
      - run: python3 deploy/boot/tests/test_rewind_boot.py
      - run: sh -n deploy/kiosk/start-v2 && sh -n deploy/kiosk/xinitrc-v2 && sh -n deploy/kiosk/rewind-kiosk
      - run: bash -n deploy/install.sh
      - run: python3 deploy/tests/test_install.py
