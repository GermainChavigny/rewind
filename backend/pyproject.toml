[project]
name = "rewind"
version = "0.5.0"
description = "REWIND — a 90s TV experience for your mini PC"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.27",
  "tomli-w>=1.0",
  # BitTorrent downloads. No wheel for macOS + Python 3.13: downloads are then
  # unavailable (the TV runs Linux).
  "libtorrent>=2.0; sys_platform == 'linux'",
  # Re-times downloaded subtitles on the soundtrack.
  "ffsubsync>=0.4",
]

[project.scripts]
rewind = "rewind.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rewind"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "rewind.context.require"]
